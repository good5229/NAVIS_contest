<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDI 기반 정책 시뮬레이터 - 지역발전지수 정책 효과 분석</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/plotly.js@2.14.0/dist/plotly.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 20px;
            padding: 30px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .home-btn:hover {
            background: white;
            color: #667eea;
            transform: scale(1.1);
            text-decoration: none;
        }
        .scenario-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        .scenario-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .scenario-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #f8f9ff 0%, #e3f2fd 100%);
        }
        .rdi-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }
        .rdi-indicator {
            background: white;
            border-radius: 8px;
            padding: 10px;
            margin: 5px 0;
            border-left: 4px solid #667eea;
        }
        .btn-simulate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        .btn-simulate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .results-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .chart-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <div class="header">
                <!-- 홈 버튼 -->
                <a href="index.html" class="home-btn" title="메인 페이지로 돌아가기">
                    <i class="fas fa-home"></i>
                </a>
                
                <h1 class="display-4"><i class="fas fa-chart-line"></i> RDI 기반 정책 시뮬레이터</h1>
                <p class="lead">NABIS 객관지표 데이터를 활용한 지역발전지수 정책 효과 분석</p>
            </div>

            <div class="row">
                <div class="col-md-8">
                    <div class="parameter-section">
                        <h3><i class="fas fa-cogs"></i> 정책 시나리오 선택</h3>
                        <p class="text-muted">정책 투자 방향에 따라 RDI 부문별 효과를 시뮬레이션합니다.</p>
                        
                        <div class="row" id="scenario-cards">
                            <!-- 시나리오 카드들이 여기에 동적으로 생성됩니다 -->
                        </div>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="parameter-section">
                        <h3><i class="fas fa-info-circle"></i> RDI 구조</h3>
                        <div class="rdi-section">
                            <h5>생활서비스지수 (삶터)</h5>
                            <div class="rdi-indicator">의료기반</div>
                            <div class="rdi-indicator">교육기반</div>
                            <div class="rdi-indicator">복지기반</div>
                            <div class="rdi-indicator">문화휴양기반</div>
                        </div>
                        <div class="rdi-section">
                            <h5>지역경제력지수 (일터)</h5>
                            <div class="rdi-indicator">경제기반</div>
                            <div class="rdi-indicator">혁신기반</div>
                        </div>
                        <div class="rdi-section">
                            <h5>삶의여유공간지수 (쉼터)</h5>
                            <div class="rdi-indicator">환경기반</div>
                            <div class="rdi-indicator">공원녹지기반</div>
                            <div class="rdi-indicator">주거기반</div>
                        </div>
                        <div class="rdi-section">
                            <h5>주민활력지수 (공동체의 터)</h5>
                            <div class="rdi-indicator">인구변화</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button class="btn btn-simulate" onclick="runRDISimulation()">
                    <i class="fas fa-play"></i> 시뮬레이션 실행
                </button>
            </div>

            <div class="results-section" id="results-section" style="display: none;">
                <h3><i class="fas fa-chart-bar"></i> 시뮬레이션 결과</h3>
                <div id="results-content">
                    <!-- 결과가 여기에 표시됩니다 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // RDI 시뮬레이션 데이터 로드
        let rdiSimulatorData = null;

        // 데이터 로드
        async function loadRDISimulationData() {
            try {
                const response = await fetch('data/nabis/rdi_simulation_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                rdiSimulatorData = await response.json();
                console.log('RDI 시뮬레이션 데이터 로드 완료:', rdiSimulatorData);
            } catch (error) {
                console.error('데이터 로드 오류:', error);
                console.log('기본 데이터로 폴백합니다.');
                // 기본 데이터 사용
                rdiSimulatorData = {
                    policy_scenarios: {
                        '균형발전': { name: '균형발전', description: '모든 RDI 부문에 균등하게 투자', color: '#667eea' },
                        '경제중심': { name: '경제중심', description: '지역경제력지수에 집중 투자', color: '#28a745' },
                        '사회중심': { name: '사회중심', description: '생활서비스지수와 주민활력지수에 집중 투자', color: '#dc3545' },
                        '환경중심': { name: '환경중심', description: '삶의여유공간지수에 집중 투자', color: '#20c997' },
                        '문화예술중심': { name: '문화예술중심', description: '생활서비스지수(문화휴양)에 집중 투자', color: '#fd7e14' },
                        '안전중심': { name: '안전중심', description: '생활서비스지수(의료)에 집중 투자', color: '#6f42c1' },
                        '주거중심': { name: '주거중심', description: '삶의여유공간지수(주거)에 집중 투자', color: '#e83e8c' },
                        'R&D중심': { name: 'R&D중심', description: '지역경제력지수(혁신)에 집중 투자', color: '#17a2b8' },
                        '혁신중심': { name: '혁신중심', description: '지역경제력지수(혁신)에 집중 투자', color: '#6c757d' }
                    },
                    simulation_results: {}
                };
            }
        }

        // 시나리오 카드 생성
        function createScenarioCards() {
            const container = document.getElementById('scenario-cards');
            container.innerHTML = '';
            
            if (!rdiSimulatorData || !rdiSimulatorData.policy_scenarios) {
                container.innerHTML = '<div class="col-12"><p class="text-center">데이터를 로드하는 중...</p></div>';
                return;
            }
            
            Object.values(rdiSimulatorData.policy_scenarios).forEach(scenario => {
                const card = document.createElement('div');
                card.className = 'col-md-4 col-lg-4';
                card.innerHTML = `
                    <div class="scenario-card" data-scenario="${scenario.name}" onclick="selectScenario('${scenario.name}')">
                        <h5 style="color: ${scenario.color}"><i class="fas fa-chart-pie"></i> ${scenario.name}</h5>
                        <p class="text-muted">${scenario.description}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 시나리오 선택
        function selectScenario(scenarioName) {
            // 모든 카드에서 selected 클래스 제거
            document.querySelectorAll('.scenario-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // 선택된 카드에 selected 클래스 추가
            document.querySelector(`[data-scenario="${scenarioName}"]`).classList.add('selected');
        }

        // RDI 시뮬레이션 실행
        function runRDISimulation() {
            const selectedCard = document.querySelector('.scenario-card.selected');
            if (!selectedCard) {
                alert('시나리오를 선택해주세요.');
                return;
            }
            
            const scenarioName = selectedCard.getAttribute('data-scenario');
            
            // 시뮬레이션 실행
            const results = simulateRDI(scenarioName);
            
            // 결과 표시
            displayResults(results, scenarioName);
            
            document.getElementById('results-section').style.display = 'block';
        }

        // RDI 시뮬레이션 계산
        function simulateRDI(scenarioName) {
            if (!rdiSimulatorData || !rdiSimulatorData.simulation_results[scenarioName]) {
                // 기본 시뮬레이션 로직 - 올바른 값으로 수정
                const defaultImprovements = {
                    '균형발전': 0.5,
                    '경제중심': 0.4,
                    '사회중심': 0.35,
                    '환경중심': 0.3,
                    '문화예술중심': 0.25,
                    '안전중심': 0.3,
                    '주거중심': 0.25,
                    'R&D중심': 0.4,
                    '혁신중심': 0.4
                };
                
                const improvement = defaultImprovements[scenarioName] || 0.4;
                
                return {
                    scenario: scenarioName,
                    regions: {},
                    summary: { 
                        averageImprovement: improvement, 
                        maxImprovement: improvement, 
                        minImprovement: improvement 
                    },
                    bdsImprovement: improvement
                };
            }
            
            const scenarioResults = rdiSimulatorData.simulation_results[scenarioName];
            
            const results = {
                scenario: scenarioName,
                regions: scenarioResults,
                summary: {}
            };
            
            // 지역별 개선 효과에서 average_improvement 제외하고 계산
            const regionImprovements = Object.entries(scenarioResults)
                .filter(([key, value]) => key !== 'average_improvement')
                .map(([key, value]) => value.improvement);
            
            // 요약 통계 계산 (각 지역의 BDS 개선효과 평균값)
            results.summary = {
                averageImprovement: regionImprovements.reduce((sum, imp) => sum + imp, 0) / regionImprovements.length,
                maxImprovement: Math.max(...regionImprovements),
                minImprovement: Math.min(...regionImprovements)
            };
            
            return results;
        }

        // 결과 표시
        function displayResults(results, scenarioName) {
            const content = document.getElementById('results-content');
            
            // 요약 통계
            content.innerHTML = `
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">평균 개선</h5>
                                <h3 class="text-primary">${results.summary.averageImprovement.toFixed(2)}점</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">최대 개선</h5>
                                <h3 class="text-success">${results.summary.maxImprovement.toFixed(2)}점</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">최소 개선</h5>
                                <h3 class="text-warning">${results.summary.minImprovement.toFixed(2)}점</h3>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h5>지역별 RDI 개선 효과</h5>
                    <div id="rdi-chart"></div>
                </div>
                
                <div class="chart-container">
                    <h5>지역별 상세 결과</h5>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>지역</th>
                                    <th>현재 RDI</th>
                                    <th>예측 RDI</th>
                                    <th>개선 효과</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${Object.entries(results.regions)
                                    .filter(([key, value]) => key !== 'average_improvement')
                                    .map(([region, data]) => `
                                    <tr>
                                        <td>${region}</td>
                                        <td>${data.current_rdi.toFixed(2)}</td>
                                        <td>${data.predicted_rdi.toFixed(2)}</td>
                                        <td class="${data.improvement > 0 ? 'text-success' : 'text-danger'}">
                                            ${data.improvement > 0 ? '+' : ''}${data.improvement.toFixed(2)}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            // 차트 생성
            createRDIChart(results);
        }

        // RDI 차트 생성
        function createRDIChart(results) {
            // average_improvement 제외하고 지역별 데이터만 추출
            const regionData = Object.entries(results.regions)
                .filter(([key, value]) => key !== 'average_improvement');
            
            const regions = regionData.map(([region, data]) => region);
            const currentRDIs = regionData.map(([region, data]) => data.current_rdi);
            const newRDIs = regionData.map(([region, data]) => data.predicted_rdi);
            
            const trace1 = {
                x: regions,
                y: currentRDIs,
                type: 'bar',
                name: '현재 RDI',
                marker: { color: '#667eea' }
            };
            
            const trace2 = {
                x: regions,
                y: newRDIs,
                type: 'bar',
                name: '예측 RDI',
                marker: { color: '#28a745' }
            };
            
            const layout = {
                title: `${results.scenario} 정책 시뮬레이션 결과`,
                xaxis: { title: '지역' },
                yaxis: { title: 'RDI 점수' },
                barmode: 'group'
            };
            
            Plotly.newPlot('rdi-chart', [trace1, trace2], layout);
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', async function() {
            await loadRDISimulationData();
            createScenarioCards();
        });
    </script>
</body>
</html>
